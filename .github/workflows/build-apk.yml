name: Build Android APK (CI/CD)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # =========================================================================
      # OPTIONAL: Konfigurasi Keystore Signing untuk Signed Release APK
      # -------------------------------------------------------------------------
      # Jika ingin build Signed APK, simpan file .jks Anda ke base64:
      #   base64 -w 0 your_keystore.jks > keystore_base64.txt
      # Lalu tambahkan ke GitHub Secrets:
      #   - KEYSTORE_BASE64 : Isi string base64 dari keystore
      #   - KEYSTORE_PASSWORD : Password keystore
      #   - KEY_ALIAS : Alias key
      #   - KEY_PASSWORD : Password alias key
      #
      # Buka komentar blok step di bawah ini:
      # - name: Decode Keystore from GitHub Secrets
      #   if: env.KEYSTORE_BASE64 != ''
      #   env:
      #     KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      #   run: |
      #     echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
      # =========================================================================

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Unsigned Release APK
        # Jika keystore environment variable tersedia di secrets, akan otomatis ditandatangani sesuai konfigurasi di build.gradle.kts
        env:
          KEYSTORE_FILE: "release-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MalwaGeni-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MalwaGeni-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
